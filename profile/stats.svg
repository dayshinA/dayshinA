<svg
  xmlns="http://www.w3.org/2000/svg"
  width="495"
  height="205"
  viewBox="0 0 495 205"
  role="img"
  aria-label="Dayshin GitHub statistics"
>
  <style>
    .title {
      font: 600 18px -apple-system,BlinkMacSystemFont,
            "Segoe UI",Helvetica,Arial,sans-serif;
      fill: #58a6ff;
    }

    .label {
      font: 400 14px -apple-system,BlinkMacSystemFont,
            "Segoe UI",Helvetica,Arial,sans-serif;
      fill: #c9d1d9;
    }

    .value {
      font: 600 14px -apple-system,BlinkMacSystemFont,
            "Segoe UI",Helvetica,Arial,sans-serif;
      fill: #ffffff;
    }

    .footer {
      font: 400 11px -apple-system,BlinkMacSystemFont,
            "Segoe UI",Helvetica,Arial,sans-serif;
      fill: #8b949e;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="6"
    width="494"
    height="204"
    fill="#0d1117"
    stroke="#30363d"
  />

  <text
    x="25"
    y="35"
    class="title"
  >
    Dayshin's GitHub
  </text>

  <text x="25" y="72" class="label">
    Accessible repositories
  </text>

  <text x="455" y="72" text-anchor="end" class="value">
    111
  </text>

  <text x="25" y="100" class="label">
    Personal repositories
  </text>

  <text x="455" y="100" text-anchor="end" class="value">
    46
  </text>

  <text x="25" y="128" class="label">
    Organisation repositories
  </text>

  <text x="455" y="128" text-anchor="end" class="value">
    50
  </text>

  <text x="25" y="156" class="label">
    Private / Public
  </text>

  <text x="455" y="156" text-anchor="end" class="value">
    92 / 19
  </text>

  <text x="25" y="188" class="footer">
    Aggregated without exposing private repository names
  </text>
</svg>
