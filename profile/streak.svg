<svg xmlns="http://www.w3.org/2000/svg" width="495" height="160" viewBox="0 0 495 160" role="img" aria-label="Dayshin GitHub commit streak">
  <style>
    .title { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #58a6ff; }
    .number { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #ffffff; }
    .label { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; }
    .accent { fill: #39d353; }
  </style>
  <rect x="0.5" y="0.5" rx="6" width="494" height="159" fill="#0d1117" stroke="#30363d" />
  <text x="25" y="35" class="title">Commit Streak</text>

  <text x="82" y="94" text-anchor="middle" class="number">2</text>
  <text x="82" y="119" text-anchor="middle" class="label">Current streak</text>

  <line x1="165" y1="58" x2="165" y2="126" stroke="#30363d" />

  <text x="247" y="94" text-anchor="middle" class="number">7</text>
  <text x="247" y="119" text-anchor="middle" class="label">Longest streak · 12 mo</text>

  <line x1="330" y1="58" x2="330" y2="126" stroke="#30363d" />

  <text x="412" y="94" text-anchor="middle" class="number accent">577</text>
  <text x="412" y="119" text-anchor="middle" class="label">Commits · 12 mo</text>
</svg>
