name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate complete GitHub stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_USERNAME: dayshinA
        run: |
          mkdir -p profile

          python3 <<'PY'
          import os
          import json
          import html
          import urllib.request
          import urllib.parse

          TOKEN = os.environ["GH_STATS_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          API_VERSION = "2026-03-10"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": API_VERSION,
              "User-Agent": f"{USERNAME}-profile-stats",
          }


          def request_json(url):
              request = urllib.request.Request(
                  url,
                  headers=headers,
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))


          # ---------------------------------------------------------
          # Get every repository visible to this token.
          #
          # Includes:
          # - repositories owned by Dayshin
          # - private repositories
          # - repositories where Dayshin is a collaborator
          # - organisation repositories accessible through membership
          # ---------------------------------------------------------

          repositories = []

          page = 1

          while True:
              params = urllib.parse.urlencode({
                  "visibility": "all",
                  "affiliation": "owner,collaborator,organization_member",
                  "per_page": 100,
                  "page": page,
                  "sort": "full_name",
              })

              url = f"https://api.github.com/user/repos?{params}"

              batch = request_json(url)

              if not batch:
                  break

              repositories.extend(batch)

              if len(batch) < 100:
                  break

              page += 1


          # Deduplicate in case GitHub returns a repo through
          # more than one affiliation relationship.

          repos_by_id = {
              repo["id"]: repo
              for repo in repositories
          }

          repositories = list(repos_by_id.values())


          # ---------------------------------------------------------
          # Repository statistics
          # ---------------------------------------------------------

          total_repos = len(repositories)

          personal_repos = sum(
              1
              for repo in repositories
              if repo["owner"]["login"].lower() == USERNAME.lower()
          )

          organisation_repos = sum(
              1
              for repo in repositories
              if repo["owner"].get("type") == "Organization"
          )

          private_repos = sum(
              1
              for repo in repositories
              if repo.get("private", False)
          )

          public_repos = total_repos - private_repos

          forks = sum(
              1
              for repo in repositories
              if repo.get("fork", False)
          )


          # ---------------------------------------------------------
          # Aggregate languages across ALL accessible repositories.
          #
          # No repository names are written to the public SVG.
          # ---------------------------------------------------------

          languages = {}

          for repo in repositories:
              languages_url = repo.get("languages_url")

              if not languages_url:
                  continue

              try:
                  repo_languages = request_json(languages_url)
              except Exception as error:
                  # A repo may be visible while its contents/language data
                  # are restricted by the organisation.
                  print(
                      f"Could not read language data for repository "
                      f"{repo.get('id')}: {error}"
                  )
                  continue

              for language, byte_count in repo_languages.items():
                  languages[language] = (
                      languages.get(language, 0)
                      + byte_count
                  )


          total_language_bytes = sum(languages.values())

          sorted_languages = sorted(
              languages.items(),
              key=lambda item: item[1],
              reverse=True,
          )

          top_languages = sorted_languages[:8]


          # ---------------------------------------------------------
          # SVG helpers
          # ---------------------------------------------------------

          language_colours = {
              "TypeScript": "#3178c6",
              "JavaScript": "#f1e05a",
              "Dart": "#00B4AB",
              "Python": "#3572A5",
              "Java": "#b07219",
              "C#": "#178600",
              "C++": "#f34b7d",
              "C": "#555555",
              "Swift": "#F05138",
              "Kotlin": "#A97BFF",
              "Go": "#00ADD8",
              "Rust": "#dea584",
              "PHP": "#4F5D95",
              "Ruby": "#701516",
              "HTML": "#e34c26",
              "CSS": "#663399",
              "Shell": "#89e051",
              "Svelte": "#ff3e00",
              "Vue": "#41b883",
          }

          fallback_colours = [
              "#58a6ff",
              "#3fb950",
              "#d29922",
              "#f85149",
              "#a371f7",
              "#db61a2",
              "#79c0ff",
              "#56d4dd",
          ]


          def escape(value):
              return html.escape(str(value))


          # ---------------------------------------------------------
          # Generate stats.svg
          # ---------------------------------------------------------

          stats_svg = f"""<svg
            xmlns="http://www.w3.org/2000/svg"
            width="495"
            height="205"
            viewBox="0 0 495 205"
            role="img"
            aria-label="Dayshin GitHub statistics"
          >
            <style>
              .title {{
                font: 600 18px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #58a6ff;
              }}

              .label {{
                font: 400 14px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #c9d1d9;
              }}

              .value {{
                font: 600 14px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #ffffff;
              }}

              .footer {{
                font: 400 11px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #8b949e;
              }}
            </style>

            <rect
              x="0.5"
              y="0.5"
              rx="6"
              width="494"
              height="204"
              fill="#0d1117"
              stroke="#30363d"
            />

            <text
              x="25"
              y="35"
              class="title"
            >
              Dayshin's GitHub
            </text>

            <text x="25" y="72" class="label">
              Accessible repositories
            </text>

            <text x="455" y="72" text-anchor="end" class="value">
              {total_repos}
            </text>

            <text x="25" y="100" class="label">
              Personal repositories
            </text>

            <text x="455" y="100" text-anchor="end" class="value">
              {personal_repos}
            </text>

            <text x="25" y="128" class="label">
              Organisation repositories
            </text>

            <text x="455" y="128" text-anchor="end" class="value">
              {organisation_repos}
            </text>

            <text x="25" y="156" class="label">
              Private / Public
            </text>

            <text x="455" y="156" text-anchor="end" class="value">
              {private_repos} / {public_repos}
            </text>

            <text x="25" y="188" class="footer">
              Aggregated without exposing private repository names
            </text>
          </svg>
          """

          with open(
              "profile/stats.svg",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(stats_svg)


          # ---------------------------------------------------------
          # Generate top-langs.svg
          # ---------------------------------------------------------

          width = 495

          title_y = 35
          bar_x = 25
          bar_width = 445
          bar_height = 8
          first_row_y = 74
          row_height = 34

          height = (
              95
              + max(len(top_languages), 1) * row_height
          )

          language_rows = []

          if total_language_bytes == 0:
              language_rows.append(
                  """
                  <text
                    x="25"
                    y="80"
                    class="label"
                  >
                    No language data available to this token.
                  </text>
                  """
              )

          else:
              for index, (language, byte_count) in enumerate(
                  top_languages
              ):
                  percentage = (
                      byte_count
                      / total_language_bytes
                      * 100
                  )

                  y = first_row_y + index * row_height

                  colour = language_colours.get(
                      language,
                      fallback_colours[
                          index % len(fallback_colours)
                      ],
                  )

                  filled_width = max(
                      bar_width * percentage / 100,
                      2,
                  )

                  language_rows.append(
                      f"""
                      <text
                        x="{bar_x}"
                        y="{y}"
                        class="label"
                      >
                        {escape(language)}
                      </text>

                      <text
                        x="{bar_x + bar_width}"
                        y="{y}"
                        text-anchor="end"
                        class="percentage"
                      >
                        {percentage:.1f}%
                      </text>

                      <rect
                        x="{bar_x}"
                        y="{y + 10}"
                        rx="4"
                        width="{bar_width}"
                        height="{bar_height}"
                        fill="#21262d"
                      />

                      <rect
                        x="{bar_x}"
                        y="{y + 10}"
                        rx="4"
                        width="{filled_width:.2f}"
                        height="{bar_height}"
                        fill="{colour}"
                      />
                      """
                  )


          langs_svg = f"""<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            role="img"
            aria-label="Languages across repositories accessible to Dayshin"
          >
            <style>
              .title {{
                font: 600 18px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #58a6ff;
              }}

              .label {{
                font: 500 13px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #c9d1d9;
              }}

              .percentage {{
                font: 400 12px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #8b949e;
              }}

              .footer {{
                font: 400 11px -apple-system,BlinkMacSystemFont,
                      "Segoe UI",Helvetica,Arial,sans-serif;
                fill: #8b949e;
              }}
            </style>

            <rect
              x="0.5"
              y="0.5"
              rx="6"
              width="{width - 1}"
              height="{height - 1}"
              fill="#0d1117"
              stroke="#30363d"
            />

            <text
              x="25"
              y="{title_y}"
              class="title"
            >
              Languages Across My GitHub
            </text>

            {''.join(language_rows)}

            <text
              x="25"
              y="{height - 20}"
              class="footer"
            >
              Personal, private and accessible organisation repositories
            </text>
          </svg>
          """

          with open(
              "profile/top-langs.svg",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(langs_svg)


          print(f"Accessible repositories: {total_repos}")
          print(f"Personal repositories: {personal_repos}")
          print(f"Organisation repositories: {organisation_repos}")
          print(f"Private repositories: {private_repos}")
          print(f"Public repositories: {public_repos}")
          print(f"Forks: {forks}")

          print("Top languages:")

          for language, byte_count in top_languages:
              if total_language_bytes:
                  percentage = (
                      byte_count
                      / total_language_bytes
                      * 100
                  )

                  print(
                      f"  {language}: {percentage:.2f}%"
                  )

          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push